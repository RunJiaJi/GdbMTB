    /* Remove margins and padding from the parent ul */
    #treeview {
      margin: 0;
      padding: 0;
    }
    
    /* Style the caret/arrow */
    .caret {
      cursor: pointer;
      user-select: none; /* Prevent text selection */
    }
    
    /* Create the caret/arrow with a unicode, and style it */
    .caret::before {
      content: "\1F782";
      color: rgb(0, 0, 0);
      display: inline-block;
      margin-right: 10px;
      
    }
    
    /* Rotate the caret/arrow icon when clicked on (using JavaScript) */
    .caret-down::before {
      transform: rotate(90deg);
    }
    
    /* Hide the nested list */
    .nested {
      display: none;
    }
    
    /* Show the nested list when the user clicks on the caret/arrow (with JavaScript) */
    .active {
      display: block;
    }

    function createTreeview() {
        const root = document.querySelector("#treeview");
        genTree(treeData, root);
        writeCount();
    }
    
    function genTree(data, root) {
        if (Array.isArray(data)) {
            data = data.reduce((a,v) => ({...a, [v]: 0}), {})
        }
        for (let i in data) {
            const li = document.createElement('li')
            const span = document.createElement('span')
            const ul = document.createElement('ul')
            const button = document.createElement('button')
            const numCount = document.createElement('a')

            span.innerText = i
            span.className = 'caret'
            ul.className = 'nested'
            numCount.className = 'count'
            numCount.href = "/GdbMTB/browser/classification/?search="+i
            numCount.target = '_blank'
            root.appendChild(li)

            const children = data[i];
            if (children) {
                li.appendChild(span)
                li.appendChild(numCount)
                li.appendChild(ul)
                genTree(children, ul)
            } else {
                li.appendChild(button)
                button.setAttribute('type',"button" )
                button.setAttribute('class',"btn mb-1 genome" )
                // button.setAttribute('data-bs-toggle',"modal" )
                // button.setAttribute('data-bs-target',"#myModal" )
                button.setAttribute('style',"backgroud-color:white" )
                button.innerText = i
                button.onclick = () => {
                    const modal = new bootstrap.Modal(document.getElementById('externalLinkModal'))
                    const panel = document.querySelector("#externalLinkPanel");
                    panel.innerHTML = exLinks[i].join("\n");

                    modal.toggle();
                }
            }
            
            span.addEventListener("click", function() {
                this.parentElement.querySelector(".nested").classList.toggle("active");
                this.classList.toggle("caret-down");
            })
        }
    }

    function writeCount() {
        const taxaLabelList = document.querySelectorAll("li:has(> a.count)");
        taxaLabelList.forEach((item) => {
            item.querySelector("a.count").innerText = item.querySelectorAll("button").length;
        });
    }

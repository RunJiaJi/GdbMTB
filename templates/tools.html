{% extends "layout.html" %}
{% block content %}
  <h1>MagCluster and other Tools</h1>
  <form action="/tools" method="post" enctype="multipart/form-data">
    <div class="row mb-3">
      <input type="file" class="form-control" aria-label="upload file" name="userfile" required>
      <div class="invalid-feedback">Invalid file</div>
    </div>
    <div class="row mb-3">
      <label for="Email" class="col-sm-2 col-form-label">Email</label>
      <div class="col-sm-10">
        <input type="email" class="form-control" id="Email" name="useremail" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>  
{% endblock content %}

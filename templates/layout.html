<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MTB genomic database">
    <meta name="author" content="jirunjia@gmail.com">
    <title>MTB Database · Genomic</title>

    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='/dist/css/bootstrap.min.css') }}">
    <link rel="icon" type="image/x-icon" href="./static/brand/logo.png">
    <style>
        .carousel-control-next,
        .carousel-control-prev,
        .carousel-indicators {
          filter: invert(100%);
        }
        /* .carousel img {
            width: auto;
            height: 100%;
        } */
        .carousel-caption {
            color: black;
        }
      </style>
    {% if title %}
        <title>MTB Database - {{ title }}</title>
    {% else %}
        <title>MTB Database</title>
    {% endif %}
  </head>

  <body>
    <header class="d-flex flex-wrap px-3 border-bottom navbar-fixed-top bg-dark">
        <div class="container">
            <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
                <div class="container-fluid">
                <a class="navbar-brand" href="/">MTB Database</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/browser">Browser</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/tree">Tree</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/statistics">Statistics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/download">Download</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/tools">Tools</a>
                    </li>
                    </ul>
                    <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
                </div>
            </nav>
        </div>

    </header>

    <main style="padding-top: 70px;">
        {% block content %}{% endblock content%}
    </main>

    <script src="./static/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
